name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lims_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select isolated PostgreSQL service
        if: matrix.database == 'postgres'
        run: echo 'LIMS_TEST_POSTGRES=postgresql+psycopg://lims_test:ci-only-password@localhost:5432/lims_test' >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s acceptance -t . -v
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
